# Windows-Installer für den Flutlicht Manager (Electron, Ordner flutlicht-manager/desktop).
# Läuft auf einem Windows-Rechner von GitHub, sobald sich etwas an der App-Hülle oder am Spiel ändert (nur auf dem Zweig claude/eager-tesla-glelt2),
# oder von Hand. Ergebnis: Flutlicht-Manager-Setup-<Version>.exe als Artefakt des Laufs (Actions → Lauf → Artifacts), 30 Tage aufbewahrt.
# Ohne Code-Signatur: Windows zeigt beim ersten Start „Der Computer wurde durch Windows geschützt“ → „Weitere Informationen“ → „Trotzdem ausführen“.
name: Windows-Installer
on:
  workflow_dispatch:
  push:
    branches: ['claude/eager-tesla-glelt2']   # nur ein Zweig, sonst baut jeder Push auf die drei Claude-Zweige dreimal
    paths:
      - 'flutlicht-manager/desktop/**'
      - 'flutlicht-manager/index.html'
      - 'flutlicht-manager/js/**'
      - 'flutlicht-manager/css/**'
      - 'flutlicht-manager/daten/**'
      - '.github/workflows/windows-installer.yml'
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutlicht-manager/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flutlicht-manager/desktop/package-lock.json
      - run: npm ci
      - run: npm run installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Flutlicht-Manager-Windows-Installer
          path: flutlicht-manager/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
